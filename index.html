<style>
body{margin:0;background:#F7F5F0;font-family:'Inter',system-ui,sans-serif;color:#12211F}
a{color:#0A6572}a:hover{color:#12211F}
#evidencia a,#datos a{color:#7FE0D0}
button{font-family:inherit}
.node:focus-visible{outline:3px solid #12211F;outline-offset:3px}
.chip:focus-visible,.row:focus-visible,.sec:focus-visible{outline:3px solid #D9B65F;outline-offset:2px}
.flip:focus-visible{outline:3px solid #0A6572;outline-offset:4px;border-radius:16px}
.sec:hover,.row:hover{background:#1C312D!important}
@property --n{syntax:'<integer>';inherits:true;initial-value:0}
.cnt::after{content:counter(c);counter-reset:c var(--n)}
@keyframes cntup{from{--n:0}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes ringin{from{stroke-dashoffset:327}}
@supports (animation-timeline: view()){
 .cnt .t{display:none}
 .cnt{animation:cntup linear both;animation-timeline:view();animation-range:entry 0% entry 95%}
 .gr{transform-origin:left center;animation:grow linear both;animation-timeline:view();animation-range:entry 0% entry 95%}
 .ring{animation:ringin linear both;animation-timeline:view();animation-range:entry 0% entry 95%}
}
@media (prefers-reduced-motion:reduce){
 .cnt,.gr,.ring{animation:none!important}
 .cnt .t{display:inline!important}.cnt::after{content:none}
 *{transition-duration:.01ms!important}
}
</style>

</head>

<p style="margin:0;font-size:18px;line-height:1.6;color:#3A4E4B;max-width:52ch">Mapa Circular reúne herramientas gratuitas y de pago para ordenar lo que tu organización ya hace en economía circular y llegar preparada a la ISO 59001, la norma de sistemas de gestión que hoy se está redactando.</p>
<div style="display:flex;flex-wrap:wrap;gap:20px;align-items:center">
<a href="https://partida.mapacircular.cl" style="display:inline-flex;align-items:center;min-height:48px;padding:0 26px;border-radius:999px;background:#0A6572;color:#FFFFFF;text-decoration:none;font-size:16px;font-weight:600">Empieza gratis</a>

<section id="evidencia" style="background:#12211F;color:#F7F5F0">

<!-- 1 · triple crisis -->
<div style="padding:96px clamp(16px,4vw,56px) 72px;max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:48px">
<div style="display:flex;flex-direction:column;gap:20px;max-width:760px">
<h2 style="margin:0;font-family:'Source Serif 4',Georgia,serif;font-weight:600;letter-spacing:-0.015em;line-height:1.08;text-wrap:balance;font-size:clamp(34px,4.6vw,56px)">Tres crisis, un mismo lugar donde actuar: cómo usamos los recursos.</h2>
<p style="margin:0;font-size:18px;line-height:1.6;color:#B9C4C1;max-width:60ch">El Programa de las Naciones Unidas para el Medio Ambiente llama triple crisis planetaria a la suma de cambio climático, pérdida de naturaleza y biodiversidad, y contaminación y residuos. Su panel de recursos le pone cifras a la conexión con la extracción de materiales.</p>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:32px">
<div class="crisis" style="border-top:3px solid #E0825F;padding-top:22px;display:flex;flex-direction:column;gap:12px">
<div style="font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:clamp(64px,8vw,96px);line-height:1"><span class="cnt" style="--n:60"><span class="t">60</span></span><span style="font-size:0.5em">%</span></div>
<div style="font-size:20px;font-weight:600">Cambio climático</div>
<p style="margin:0;font-size:16px;line-height:1.55;color:#B9C4C1;max-width:34ch">Más de 60% de las emisiones de gases de efecto invernadero viene de extraer y procesar recursos.</p>
</div>
<div class="crisis" style="border-top:3px solid #5FC4D0;padding-top:22px;display:flex;flex-direction:column;gap:12px">
<div style="font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:clamp(64px,8vw,96px);line-height:1"><span class="cnt" style="--n:90"><span class="t">90</span></span><span style="font-size:0.5em">%</span></div>
<div style="font-size:20px;font-weight:600">Naturaleza y biodiversidad</div>
<p style="margin:0;font-size:16px;line-height:1.55;color:#B9C4C1;max-width:34ch">Extraer y procesar biomasa explica 90% de la pérdida de biodiversidad en tierra.</p>
</div>
<div class="crisis" style="border-top:3px solid #D9B65F;padding-top:22px;display:flex;flex-direction:column;gap:12px">
<div style="font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:clamp(64px,8vw,96px);line-height:1;color:#D9B65F">&#8734;</div>
<div style="font-size:20px;font-weight:600">Contaminación y residuos</div>
<p style="margin:0;font-size:16px;line-height:1.55;color:#B9C4C1;max-width:34ch">Aire, agua y suelo, químicos, plásticos y residuos industriales. Cada recurso que sale de la economía sin valorizarse vuelve como residuo.</p>
</div>
</div>
<p style="margin:0;font-size:13px;line-height:1.5;color:#B9C4C1;max-width:72ch">Fuentes: <a href="https://www.unep.org/news-and-stories/speech/law-shield-against-triple-planetary-crisis">PNUMA, discurso del 16 de noviembre de 2024</a> (triple crisis planetaria) y <a href="https://resourcepanel.org/news-events/global-resources-outlook-2024-press-release">Global Resources Outlook 2024, Panel Internacional de Recursos y PNUMA</a> (60% de las emisiones y 90% de la pérdida de biodiversidad en tierra, por biomasa).</p>
</div>

<!-- 2 · límites planetarios -->
<div id="dial" style="padding:48px clamp(16px,4vw,56px) 96px;max-width:1280px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:56px;align-items:center">
<div style="display:flex;flex-direction:column;gap:24px;min-width:0">
<h2 style="margin:0;font-family:'Source Serif 4',Georgia,serif;font-weight:600;letter-spacing:-0.015em;line-height:1.08;text-wrap:balance;font-size:clamp(34px,4.6vw,56px)">Siete de nueve límites planetarios ya están superados.</h2>
<p style="margin:0;font-size:18px;line-height:1.6;color:#B9C4C1;max-width:54ch">En 2009 estaban superados tres. En la evaluación de 2025, la acidificación de los océanos se sumó a la lista. Mueve los años y mira cómo crece el anillo naranja. El círculo punteado dorado marca el límite.</p>
<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
<sc-for list="{{years}}" as="y" hint-placeholder-count="4">
<button class="chip" onClick="{{y.pick}}" style="min-height:44px;padding:0 20px;border-radius:999px;border:2px solid {{y.bc}};background:{{y.bg}};color:{{y.fg}};font-size:16px;font-weight:600;cursor:pointer;transition:background .2s ease,color .2s ease">{{y.label}}</button>
</sc-for>
<button class="chip" onClick="{{play}}" style="min-height:44px;padding:0 20px;border-radius:999px;border:2px solid #5FC4D0;background:transparent;color:#5FC4D0;font-size:16px;font-weight:600;cursor:pointer">Ver de 2009 a 2025</button>
</div>
<div style="display:flex;flex-direction:column;gap:2px;min-height:64px">
<div style="font-family:'Source Serif 4',Georgia,serif;font-size:28px;font-weight:600">{{dial.crossed}} de {{dial.assessed}} cuantificados tienen su límite superado</div>
<div style="font-size:15px;line-height:1.5;color:#B9C4C1">{{dial.hoverLine}}</div>
</div>
<ul style="list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px 24px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="9">
<li><button class="row" onMouseEnter="{{r.hv}}" onFocus="{{r.hv}}" onClick="{{r.hv}}" style="width:100%;display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;border:0;background:{{r.bg}};color:#F7F5F0;text-align:left;font-size:14px;line-height:1.3;cursor:pointer">
<span style="width:12px;height:12px;border-radius:50%;flex:none;box-sizing:border-box;background:{{r.dot}};border:{{r.dbd}}"></span>
<span style="min-width:0">{{r.n}}<span style="display:block;font-size:12px;color:#B9C4C1">{{r.state}}</span></span>
</button></li>
</sc-for>
</ul>
<p style="margin:0;font-size:13px;line-height:1.5;color:#B9C4C1;max-width:72ch">Fuente: <a href="https://www.stockholmresilience.org/news--events/general-news/2025-09-24-seven-of-nine-planetary-boundaries-now-breached">Planetary Health Check 2025, Instituto de Potsdam y Stockholm Resilience Centre</a>. La evolución 2009, 2015 y 2023 sigue el marco publicado por Rockström, Steffen, Richardson y colaboradores.</p>
</div>

<div style="width:100%;max-width:560px">

<!-- 3 · extracción -->
<div style="border-top:1px solid #2A403C">
<div style="padding:88px clamp(16px,4vw,56px);max-width:1280px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:56px;align-items:end">
<div style="display:flex;flex-direction:column;gap:22px;min-width:0">
<h2 style="margin:0;font-family:'Source Serif 4',Georgia,serif;font-weight:600;letter-spacing:-0.015em;line-height:1.08;text-wrap:balance;font-size:clamp(34px,4.6vw,56px)">La extracción de materiales se triplicó en cinco décadas.</h2>
<p style="margin:0;font-size:18px;line-height:1.6;color:#B9C4C1;max-width:52ch">Si siguen las tendencias actuales, podría crecer otro 60% hacia 2060, respecto de 2020. Es una razón concreta para usar mejor lo que ya está en circulación.</p>
<p style="margin:0;font-size:13px;line-height:1.5;color:#B9C4C1;max-width:72ch">Fuente: <a href="https://resourcepanel.org/news-events/global-resources-outlook-2024-press-release">Global Resources Outlook 2024, Panel Internacional de Recursos y PNUMA</a>. El comunicado no indica el año de la cifra de 106 mil millones de toneladas.</p>
</div>
<div style="display:flex;flex-direction:column;gap:22px;min-width:0">
<div style="display:flex;flex-direction:column;gap:8px">
<div style="display:flex;justify-content:space-between;font-size:15px;color:#B9C4C1"><span>1970</span><span><span class="cnt" style="--n:30"><span class="t">30</span></span> mil millones de toneladas</span></div>
<div style="height:34px;background:#1C312D;border-radius:6px;overflow:hidden"><div class="gr" style="height:100%;width:28.3%;background:#5FC4D0;border-radius:6px"></div></div>
</div>
<div style="display:flex;flex-direction:column;gap:8px">
<div style="display:flex;justify-content:space-between;font-size:15px;color:#B9C4C1"><span>Informe 2024</span><span><span class="cnt" style="--n:106"><span class="t">106</span></span> mil millones de toneladas</span></div>
<div style="height:34px;background:#1C312D;border-radius:6px;overflow:hidden"><div class="gr" style="height:100%;width:100%;background:#E0825F;border-radius:6px"></div></div>
</div>
</div>
</div>
</div>

<!-- 4 · cadena -->
<div style="border-top:1px solid #2A403C">
<div style="padding:88px clamp(16px,4vw,56px) 104px;max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:44px">
<div style="display:flex;flex-direction:column;gap:20px;max-width:780px">
<h2 style="margin:0;font-family:'Source Serif 4',Georgia,serif;font-weight:600;letter-spacing:-0.015em;line-height:1.08;text-wrap:balance;font-size:clamp(34px,4.6vw,56px)">En varios sectores, la mayor parte de las emisiones está en la cadena de proveedores.</h2>
<p style="margin:0;font-size:18px;line-height:1.6;color:#B9C4C1;max-width:60ch">Una empresa sola mueve su parte. El resto se mueve con proveedores y clientes. Por eso la ISO 59010 mira la red de valor y no solo a la empresa.</p>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:48px;align-items:center">
<div style="display:flex;flex-direction:column;gap:6px;min-width:0">
<sc-for list="{{sectors}}" as="s" hint-placeholder-count="7">
<button class="sec" onClick="{{s.pick}}" onMouseEnter="{{s.pick}}" onFocus="{{s.pick}}" style="display:grid;grid-template-columns:104px 1fr 44px;gap:14px;align-items:center;padding:8px 10px;border-radius:10px;border:0;background:{{s.bg}};color:#F7F5F0;cursor:pointer;text-align:left;font-size:15px">
<span>{{s.name}}</span>
<span style="height:14px;background:#1C312D;border-radius:4px;overflow:hidden;display:block"><span class="gr" style="display:block;height:100%;width:{{s.w}}%;background:{{s.c}};border-radius:4px"></span></span>
<span style="font-variant-numeric:tabular-nums;text-align:right;font-weight:600">{{s.pct}}%</span>
</button>
</sc-for>
</div>
<div style="display:flex;flex-direction:column;gap:18px;min-width:0">
<div style="font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:clamp(88px,12vw,148px);line-height:0.95;color:{{sec.c}}">{{sec.pct}}<span style="font-size:0.45em">%</span></div>
<div style="font-size:20px;line-height:1.4;max-width:30ch">de las emisiones del sector {{sec.nameLower}} está en la cadena de proveedores.</div>
<div style="height:22px;border-radius:6px;background:#E0825F;overflow:hidden;max-width:420px"><div style="height:100%;width:{{sec.pct}}%;background:{{sec.c}};transition:width .7s cubic-bezier(.2,.8,.2,1)"></div></div>
<div style="display:flex;gap:22px;font-size:13px;color:#B9C4C1;flex-wrap:wrap"><span>Cadena de proveedores</span><span>Operación propia, el resto</span></div>
</div>
</div>
<p style="margin:0;font-size:13px;line-height:1.5;color:#B9C4C1;max-width:72ch">Fuente: <a href="https://www3.weforum.org/docs/WEF_Net_Zero_Challenge_The_Supply_Chain_Opportunity_2021.pdf">Foro Económico Mundial, Net-Zero Challenge: The Supply Chain Opportunity, 2021</a>.</p>
</div>
</div>

</section>

<!-- 6 · mitos -->
<section id="mitos" style="background:#EFEBE0;color:#12211F">
<div style="padding:96px clamp(16px,4vw,56px);max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:44px">
<div style="display:flex;flex-direction:column;gap:18px;max-width:760px">
<h2 style="margin:0;font-family:'Source Serif 4',Georgia,serif;font-weight:600;letter-spacing:-0.015em;line-height:1.08;text-wrap:balance;font-size:clamp(34px,4.6vw,56px)">Seis frases que se repiten sobre la economía circular.</h2>
<p style="margin:0;font-size:18px;line-height:1.6;color:#3A4E4B;max-width:56ch">Pasa el cursor, o toca una tarjeta, para ver qué dice la norma y qué dicen los datos.</p>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:20px">
<sc-for list="{{myths}}" as="m" hint-placeholder-count="6">
<button class="flip" onClick="{{m.tog}}" onMouseEnter="{{m.on}}" onMouseLeave="{{m.off}}" onFocus="{{m.on}}" onBlur="{{m.off}}" aria-label="{{m.aria}}" style="position:relative;height:244px;padding:0;border:0;background:transparent;cursor:pointer;perspective:1200px;text-align:left;color:inherit">
<span style="position:absolute;inset:0;transform-style:preserve-3d;transform:rotateY({{m.rot}});transition:transform .6s cubic-bezier(.2,.8,.2,1)">
<span style="position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#FFFFFF;border:1px solid #D8D2C4;border-radius:16px;padding:26px;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box">
<span style="font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:26px;line-height:1.2;max-width:20ch">{{m.myth}}</span>
</span>
<span style="position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:rotateY(180deg);background:#0A5C67;color:#FFFFFF;border-radius:16px;padding:26px 26px 44px;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box">
<span style="font-size:17px;line-height:1.5">{{m.reality}}</span>
<span style="position:absolute;left:12px;right:12px;bottom:14px;text-align:center;font-size:13px;color:#C9E6EA">{{m.src}}</span>
</span>
</span>
</button>
</sc-for>
</div>
</div>
</section>

<!-- 7 · datos y decisión -->
<section id="datos" style="background:#12211F;color:#F7F5F0">
<div style="padding:96px clamp(16px,4vw,56px);max-width:1280px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:64px 56px">
<div style="display:flex;flex-direction:column;gap:22px;min-width:0">
<h2 style="margin:0;font-family:'Source Serif 4',Georgia,serif;font-weight:600;letter-spacing:-0.015em;line-height:1.08;text-wrap:balance;font-size:clamp(32px,4vw,48px)">Los datos ya viajan con el producto.</h2>
<p style="margin:0;font-size:18px;line-height:1.6;color:#B9C4C1;max-width:52ch">En junio de 2024, Volvo presentó para su EX90 lo que describió como el primer pasaporte de batería del mundo. Registra de dónde vienen los materiales, cuánto contenido reciclado tienen y la huella de carbono. El cliente ve una versión simple en un código QR.</p>
<p style="margin:0;font-size:13px;line-height:1.5;color:#B9C4C1;max-width:72ch">Fuente: <a href="https://www.rte.ie/news/business/2024/0604/1452961-volvo-cars-ev-battery-passport">Reuters, vía RTÉ, 4 de junio de 2024</a>.</p>
<p style="margin:0;font-size:16px;line-height:1.55;color:#B9C4C1;max-width:52ch">Llegar a ese nivel parte por ordenar los datos propios: qué haces hoy, con qué indicador, desde qué línea base. Esa es la primera herramienta del mapa.</p>
</div>
<div style="display:flex;flex-direction:column;gap:28px;min-width:0">
<div style="display:flex;flex-direction:column;gap:6px;border-left:3px solid #5FC4D0;padding-left:20px">
<div style="font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:48px;line-height:1"><span class="cnt" style="--n:76"><span class="t">76</span></span>%</div>
<div style="font-size:16px;line-height:1.5;max-width:40ch">de 5.000 ejecutivos de 22 países dice que la sostenibilidad es central para su estrategia. <span style="color:#E0825F;font-weight:600"><span class="cnt" style="--n:47"><span class="t">47</span></span>%</span> declara dificultades para financiar esas inversiones.</div>
<div style="font-size:13px;color:#B9C4C1">Fuente: <a href="https://www.esgtoday.com/businesses-embedding-sustainability-outperforming-on-profitability-talent-attraction-ibm-survey/">IBM Institute for Business Value con Oxford Economics, febrero de 2024, vía ESG Today</a>.</div>
</div>
<div style="display:flex;flex-direction:column;gap:6px;border-left:3px solid #D9B65F;padding-left:20px">
<div style="font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:48px;line-height:1"><span class="cnt" style="--n:21"><span class="t">21</span></span>%</div>
<div style="font-size:16px;line-height:1.5;max-width:40ch">más de margen EBITDA en las empresas con mayor puntaje de prácticas de sostenibilidad. Es una asociación observada, no una relación causal demostrada.</div>
<div style="font-size:13px;color:#B9C4C1">Fuente: <a href="https://newsroom.accenture.com/news/2021/accenture-and-the-world-economic-forum-decode-the-sustainability-dna-for-companies-seeking-to-deliver-value-and-impact-for-all-stakeholders">Accenture y Foro Económico Mundial, 22 de septiembre de 2021</a>.</div>
</div>
<p style="margin:0;font-size:13px;line-height:1.5;color:#B9C4C1;max-width:52ch">En el estudio de IBM, las organizaciones que integran la sostenibilidad en sus unidades de negocio tienen 52% más probabilidad de superar a sus pares en rentabilidad. La definición exacta de "superar" no está publicada en la nota consultada.</p>
</div>
</div>
</section>

<section id="entradas" style="padding:72px clamp(16px,4vw,56px);border-top:1px solid #D8D2C4">
<h2 style="margin:0 0 40px;font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:clamp(30px,4vw,40px);line-height:1.1;letter-spacing:-0.01em">Por dónde comenzar</h2>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:40px">
<div style="display:flex;flex-direction:column;gap:10px;border-top:3px solid #0E7C8B;padding-top:18px">
<h3 style="margin:0;font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:22px">Identificar lo que ya haces</h3>
<p style="margin:0;font-size:16px;line-height:1.55;color:#3A4E4B">Marca las prácticas que tu organización ya aplica y recibe tu informe, ordenado bajo ISO 59004.</p>
<a href="https://partida.mapacircular.cl" style="font-size:15px;font-weight:600">Punto de partida circular</a>
</div>
<div style="display:flex;flex-direction:column;gap:10px;border-top:3px solid #A94A2C;padding-top:18px">
<h3 style="margin:0;font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:22px">Definir el rumbo y medir</h3>
<p style="margin:0;font-size:16px;line-height:1.55;color:#3A4E4B">Pasa de tus acciones a un objetivo de circularidad y a los números que le importan a tu cliente y a tus partes interesadas.</p>
<a href="#" style="font-size:15px;font-weight:600;color:#6E8581;text-decoration:none;cursor:default">Próximamente</a>
</div>
<div style="display:flex;flex-direction:column;gap:10px;border-top:3px solid #B08D3F;padding-top:18px">
<h3 style="margin:0;font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:22px">Construir algo a medida</h3>
<p style="margin:0;font-size:16px;line-height:1.55;color:#3A4E4B">Desarrollamos herramientas sobre ISO u otras normas de sostenibilidad para tu programa o tu gremio.</p>
<a href="#" style="font-size:15px;font-weight:600">Conversemos</a>
</div>
</div>
</section>

setState(p){Object.assign(this.state,p);if(this._q)return;this._q=true;Promise.resolve().then(()=>{this._q=false;window.__render();});}}

      ['Entidades nuevas: químicos y plásticos', { 2009: 'n', 2015: 'n', 2023: 'x', 2025: 'x' }],
      ['Acidificación de los océanos', { 2009: 'o', 2015: 'o', 2023: 'o', 2025: 'x' }],
      ['Reducción del ozono', { 2009: 'o', 2015: 'o', 2023: 'o', 2025: 'o' }],
      ['Aerosoles en la atmósfera', { 2009: 'n', 2015: 'n', 2023: 'o', 2025: 'o' }]
    ];
    const hov = this.state.hov;
    let crossed = 0, assessed = 0;
    const w = {};
    const rows = [];
    const lab = { x: 'Límite superado', o: 'Dentro del límite', n: 'Sin cuantificar' };
    B.forEach(([name, st], i) => {
      const k = st[Y];
      if (k !== 'n') assessed++;
      if (k === 'x') crossed++;
      const dim = hov >= 0 && hov !== i;
      w['w' + i] = {
        bf: k === 'n' ? 'transparent' : (k === 'x' ? '#1F6F78' : '#2FA3B3'),
        bs: k === 'n' ? '#7D8E8A' : 'none',
        bd: k === 'n' ? '4 4' : 'none',
        bo: dim ? '0.4' : '1',
        oo: k === 'x' ? (dim ? '0.4' : '1') : '0',
        ot: k === 'x' ? 'scale(1)' : 'scale(0.55)',
        hv: () => this.setState({ hov: i })
      };
      rows.push({
        n: name, state: lab[k],
        dot: k === 'x' ? '#E0825F' : (k === 'o' ? '#2FA3B3' : 'transparent'),
        dbd: k === 'n' ? '2px dashed #7D8E8A' : 'none',
        bg: hov === i ? '#1C312D' : 'transparent',
        hv: () => this.setState({ hov: i })
      });
    });
    const hoverLine = hov >= 0 ? (B[hov][0] + ': ' + lab[B[hov][1][Y]].toLowerCase() + ' en ' + Y + '.') : (Y === 2025 ? 'Se sumó la acidificación de los océanos. Quedan dentro del límite el ozono y los aerosoles.' : 'Elige otro año o pasa el cursor por un límite.');
    const years = [2009, 2015, 2023, 2025].map((y) => ({
      label: String(y),
      bg: Y === y ? '#F7F5F0' : 'transparent',
      fg: Y === y ? '#12211F' : '#F7F5F0',
      bc: Y === y ? '#F7F5F0' : '#4A6C66',
      pick: () => { this._pl = false; this.setState({ year: y }); }
    }));

    // ---- sectores (cadena de proveedores, WEF 2021) ----
    const SEC = [
      { id: 'cemento', name: 'Cemento', p: 6 },
      { id: 'acero', name: 'Acero', p: 29 },
      { id: 'mineria', name: 'Minería', p: 30 },
      { id: 'quimicos', name: 'Químicos', p: 61 },
      { id: 'electronica', name: 'Electrónica', p: 77 },
      { id: 'automotriz', name: 'Automotriz', p: 82 },
      { id: 'alimentos', name: 'Alimentos', p: 83 }
    ];
    const ss = this.state.sector;
    const sectors = SEC.map((x) => ({
      name: x.name, pct: x.p, w: x.p,
      c: x.id === ss ? '#5FC4D0' : '#6E8581',
      bg: x.id === ss ? '#1C312D' : 'transparent',
      pick: () => this.setState({ sector: x.id })
    }));
    const sx = SEC.find((x) => x.id === ss) || SEC[6];

    // ---- mitos ----
    const MY = [
      ['La economía circular es reciclaje.', 'Reciclar es una vía entre varias. También se reutiliza, repara, remanufactura, comparte y rediseña, para mantener el valor de los recursos.', 'ISO 59004'],
      ['La economía circular es gestión de residuos.', 'Parte antes del residuo: en cómo se diseña, se vende y se usa. La gestión de residuos es una pieza del sistema.', 'ISO 59004'],
      ['La economía circular es un añadido a nuestro modelo.', 'Cambia cómo una organización crea, entrega y captura valor, y cómo se conecta con su red de valor.', 'ISO 59010'],
      ['La economía circular es solo pensar y hacer cosas nuevas.', 'Muchas organizaciones ya hacen acciones circulares sin llamarlas así. Registrarlas es el primer paso.', 'Punto de partida circular'],
      ['La economía circular es opcional.', 'Chile tiene tres leyes que ya apuntan en esta dirección: Ley REP (20.920), Ley Marco de Cambio Climático (21.455) y Ley de plásticos de un solo uso (21.368).', 'Biblioteca del Congreso Nacional'],
      ['Hay tiempo para adaptarse.', 'Siete de nueve límites planetarios tienen su límite superado y la extracción de materiales podría crecer 60% hacia 2060.', 'Planetary Health Check 2025 y Global Resources Outlook 2024']
    ];
    const fl = this.state.flips;
    const myths = MY.map((m, i) => ({
      myth: m[0], reality: m[1], src: m[2],
      aria: 'Frase: ' + m[0] + ' Respuesta: ' + m[1],
      rot: fl[i] ? '180deg' : '0deg',
      on: () => this.setState({ flips: Object.assign({}, this.state.flips, { [i]: true }) }),
      off: () => this.setState({ flips: Object.assign({}, this.state.flips, { [i]: false }) }),
      tog: () => this.setState({ flips: Object.assign({}, this.state.flips, { [i]: !this.state.flips[i] }) })
    }));

    return Object.assign({
      nodes,
      sel: {
        nombre: s0.nombre, norma: s0.norma, cl: s0.cl, entrega: s0.entrega,
        estadoLabel: s0.label || es.label,
        tagBg: es.bg, tagFg: es.fg, tagBd: es.bd,
        url: s0.url, cta: s0.cta,
        isReady: !!s0.ready, isSoon: !s0.ready
      },
      years, rows, hoverLine,
      dial: { year: String(Y), crossed: String(crossed), assessed: String(assessed), hoverLine },
      play: () => { this._pl = false; this.runPlay(); },
      sectors,
      sec: { pct: sx.p, c: sx.p >= 60 ? '#5FC4D0' : '#D9B65F', nameLower: sx.name.toLowerCase() },
      myths
    }, w);
  }
}

(function(){
const _t=document.createElement('template');_t.innerHTML=document.getElementById('tpl').textContent;const tpl=_t.content;
const HOLE=/\{\{\s*([\w.$]+)\s*\}\}/g, ONE=/^\s*\{\{\s*([\w.$]+)\s*\}\}\s*$/;
function look(p,scope){const parts=p.split('.');let v=scope[parts[0]];for(let i=1;i<parts.length&&v!=null;i++)v=v[parts[i]];return v;}

 if(t==='sc-if'){const m=n.getAttribute('value').match(/\{\{\s*([\w.$]+)/);if(look(m[1],scope))n.childNodes.forEach(c=>inst(c,scope,out));return;}

  el.setAttribute(a.name,sub(a.value,scope));}
